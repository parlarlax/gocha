name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install gocha
        run: go install github.com/parlarlax/gocha/cmd/gocha@latest

      - name: Run tests
        run: go test -json -coverprofile=coverage.out ./... | gocha -cover coverage.out -o report.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gocha-report
          path: report.html
